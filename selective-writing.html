</style><script>

(function(){
  const root=document.documentElement;
  const styles=Array.from(document.querySelectorAll('link[rel="stylesheet"]')).filter(link=>!link.sheet && link.href.startsWith(location.origin+'/'));
  const waiting=styles.map(link=>new Promise(resolve=>{
    link.addEventListener('load',resolve,{once:true});
    link.addEventListener('error',resolve,{once:true});
  }));
  if(window.topicLayoutReady)waiting.push(window.topicLayoutReady);
  Promise.all(waiting).then(()=>root.classList.remove('preparing-section'));
})();
</script></body></html>
