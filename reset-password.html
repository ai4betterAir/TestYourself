<body class="account-body"><header class="account-topbar"><a class="account-logo" href="index.html"><img src="assets/skillup-logo.svg" alt="SkillUP"></a></header><main class="auth-shell"><section class="auth-copy"><span class="eyebrow">ACCOUNT SECURITY</span><h1>Choose a strong <span>new password.</span></h1><p>Use a password you do not use on another website.</p></section><section class="auth-card"><span class="eyebrow">NEW PASSWORD</span><h2>Secure your account</h2><div id="setupNotice" class="setup-notice" hidden></div><form id="resetForm" class="auth-form"><label>New password<input id="password" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></label><button class="primary-button" type="submit">Update password</button><p id="formMessage" class="form-message" role="status" aria-live="polite"></p></form></section></main><script src="js/site-shell.js"></script><script src="js/supabase-config.js"></script><script type="module" src="js/auth.js"></script></body></html>
