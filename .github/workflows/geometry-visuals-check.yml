name: SkillUP illustrated geometry tests
on:
  push:
    branches: [skillup-visual-geometry-k6]
  pull_request:
    branches: [main]
    paths:
      - 'practice.html'
      - 'js/practice.js'
      - 'js/math-learning-v2.js'
      - 'js/geometry-visuals.js'
      - 'css/geometry-visuals.css'
      - 'scripts/check-geometry-visuals.mjs'
      - 'scripts/browser-geometry-visuals.mjs'
      - '.github/workflows/geometry-visuals-check.yml'
jobs:
  illustrated-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify question diagrams and maths answer validity
        run: node scripts/check-geometry-visuals.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test all years, guided practice, tests and mobile rendering
        run: |
          python3 -m http.server 4173 >/tmp/skillup-geometry.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/practice.html >/dev/null && break; sleep 1; done
          node scripts/browser-geometry-visuals.mjs
      - name: Save geometry screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillup-geometry-visual-previews
          path: geometry-previews/*.png
          if-no-files-found: warn
