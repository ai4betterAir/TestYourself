name: Dynamic question experience tests
on:
  push:
    branches: [skillup-dynamic-question-experience]
  pull_request:
    branches: [main]
    paths:
      - 'selective-practice.html'
      - 'js/selective-practice.js'
      - 'css/selective-question-dynamic.css'
      - 'scripts/browser-dynamic-questions.mjs'
      - '.github/workflows/dynamic-question-check.yml'
jobs:
  dynamic-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate scripts and answer bank
        run: |
          node --check js/selective-practice.js
          node --check scripts/browser-dynamic-questions.mjs
          node scripts/check-oc-figures.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then npx playwright install chromium; else echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"; fi
      - name: Check dynamic quiz, keyboard shortcuts, responsive scheduling timeline
        run: |
          python3 -m http.server 4173 >/tmp/skillup-dynamic-quiz.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/selective-practice.html >/dev/null && break; sleep 1; done
          node scripts/browser-dynamic-questions.mjs
          node scripts/browser-practice-dialog.mjs
      - name: Save design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillup-dynamic-quiz-previews
          path: |
            dynamic-question-previews/*.png
            practice-dialog-previews/*.png
          if-no-files-found: warn
