<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUP | Learn · Practice · Test · Improve</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/learn-flow.css"><style>
.skillup-brand{display:flex;align-items:center;width:255px;height:68px}
.skillup-brand img{width:100%;height:100%;object-fit:contain}
.subject-hero{padding:36px 20px 18px;text-align:center;background:linear-gradient(135deg,#e8f4ff 0%,#fff4d6 42%,#f3e8ff 72%,#e7fff3 100%)}
.subject-hero h1{font-family:Fredoka;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05;margin:10px auto 10px;color:#173B78}
.subject-hero h1 span{color:#278FE8}
.chooser{width:min(1120px,calc(100% - 32px));margin:auto;padding:10px 0 40px}
.chooser h2{font-family:Fredoka;text-align:center;color:#173B78}
#yearPicker,#subjectPicker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 22px}
#yearPicker a,#yearPicker button,#subjectPicker a{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:52px;padding:10px 16px;border-radius:16px;font:700 1rem Fredoka,sans-serif;text-decoration:none;color:#fff}
#yearPicker a,#yearPicker button{background:#2A72A5;border:0;color:#fff;cursor:pointer}
#yearPicker a.on,#yearPicker button.on{outline:3px solid #FFBF17}
#subjectPicker a.maths{background:#2A72A5}
#subjectPicker a.vocabulary{background:#6254A3}
#subjectPicker a.english{background:#0D95A1}
#subjectPicker a.selective{background:#1C5E86}
.home-menu-btn{display:none;margin-left:auto;border:0;background:#eef4ff;width:44px;height:44px;border-radius:12px}
@media(max-width:800px){.home-menu-btn{display:block}.nav-wrap .main-nav{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:#fff;padding:15px;z-index:100}}
</style><link rel="icon" type="image/svg+xml" href="assets/skillup-logo.svg"></head>
<body>
<header class="site-header"><div class="nav-wrap"><a class="skillup-brand" href="index.html"><img src="assets/skillup-logo.svg" alt="SkillUP"></a>
<button class="home-menu-btn" id="homeMenuBtn" aria-label="Open menu">☰</button>
<nav class="main-nav" id="homeNav"><a href="index.html">Home</a><a href="practice.html">Maths</a><a href="vocabulary.html">Vocabulary</a><a href="english.html">English</a><a href="selective-practice.html">Selective</a></nav>
</div></header>
<main>
<section class="subject-hero">
<h1>Choose your <span>year and subject</span></h1>
<p>Year first, then tap a subject. Each subject opens its main page.</p>
</section>
<section class="chooser" id="chooser">
<h2>1. School year</h2>
<div id="yearPicker">
<a href="#" data-year="K">Kindy</a><a href="#" data-year="1">Year 1</a><a href="#" data-year="2">Year 2</a><a href="#" data-year="3">Year 3</a><a href="#" data-year="4">Year 4</a><a href="#" data-year="5" class="on">Year 5</a><a href="#" data-year="6">Year 6</a>
</div>
<h2>2. Subject</h2>
<div id="subjectPicker">
<a class="maths" id="goMaths" href="practice.html?grade=5&focus=1">Maths</a>
<a class="vocabulary" id="goVocab" href="vocabulary-year5.html">Vocabulary</a>
<a class="english" id="goEnglish" href="english-practice.html?grade=5">English</a>
<a class="selective" id="goSelective" href="selective-practice.html?grade=5">Selective</a>
</div>
<div id="sectionPanel"></div>
</section>
</main>
<script>
(function(){
  const vocab = {K:'vocabulary-year1-stories.html',1:'vocabulary-year1-stories.html',2:'vocabulary-year2.html',3:'vocabulary-year3.html',4:'vocabulary-year4.html',5:'vocabulary-year5.html',6:'vocabulary-year6.html'};
  let year = localStorage.getItem('skillup-year') || '5';
  function sync(){
    document.querySelectorAll('#yearPicker [data-year]').forEach(a => a.classList.toggle('on', a.dataset.year === year));
    document.getElementById('goMaths').href = 'practice.html?grade=' + year + '&focus=1';
    document.getElementById('goVocab').href = vocab[year] || 'vocabulary.html';
    document.getElementById('goEnglish').href = 'english-practice.html?grade=' + year;
    document.getElementById('goSelective').href = 'selective-practice.html?grade=' + year;
    document.getElementById('goSelective').style.opacity = (year==='5'||year==='6') ? '1' : '.45';
  }
  document.getElementById('yearPicker').onclick = function(e){
    const a = e.target.closest('[data-year]'); if(!a) return;
    e.preventDefault();
    year = a.dataset.year;
    localStorage.setItem('skillup-year', year);
    sync();
  };
  const btn = document.getElementById('homeMenuBtn');
  if (btn) btn.onclick = () => document.getElementById('homeNav').classList.toggle('open');
  sync();
})();
</script>
<script src="js/site-shell.js"></script>
</body></html>
