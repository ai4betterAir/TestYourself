<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TestYourself — Level 1</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>TestYourself</h1>
    <p>Level 1 word problems</p>
  </header>
  <section id="home" class="card">
    <label>Your name
      <input id="playerName" type="text" placeholder="Optional" />
    </label>
    <label>How many questions?
      <select id="countSelect">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="all">All 202</option>
      </select>
    </label>
    <label>Start from
      <input id="startFrom" type="number" min="1" max="202" value="1" />
    </label>
    <button id="startBtn" type="button">Start practice</button>
  </section>
  <section id="quiz" class="card hidden">
    <div class="meta">
      <span id="progress"></span>
      <span id="score"></span>
    </div>
    <h2 id="qTitle"></h2>
    <p id="qText"></p>
    <p id="qPrompt" class="prompt"></p>
    <div id="inputs"></div>
    <p id="feedback"></p>
    <div class="row">
      <button id="checkBtn" type="button">Check</button>
      <button id="nextBtn" type="button" class="hidden">Next</button>
    </div>
  </section>
  <section id="done" class="card hidden">
    <h2>Well done</h2>
    <p id="summary"></p>
    <button id="againBtn" type="button">Practice again</button>
  </section>
  <script src="js/app.js"></script>
</body>
</html>
